    <style>
        :root {
            --bg-dark: #0b111f; 
            --bg-layer: #0d1524; 
            --bg-panel: #151c29;
            --bg-panel-soft: #1c2433;
            --accent: #00b8ea; 
            --accent-glow: rgba(0, 184, 234, 0.35); 
            --accent-soft: rgba(0, 184, 234, 0.18);
            --accent-strong: rgba(0, 184, 234, 0.5);
            --text-light: #f8fafd;
            --text-muted: #9da5b1;
            --text-faint: #6b7484;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.12);
            --shadow-glow: 0 0 40px -8px var(--accent);
            --shadow-glow-lg: 0 10px 60px -10px var(--accent);
            
            --color-pr: #0d0420;
            --color-pr-text: #ea77ff;
            --color-ae: #0d0420;
            --color-ae-text: #9999ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @media (pointer: fine) { * { cursor: none !important; } }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale; 
            background-image:
                radial-gradient(60rem 40rem at 80% -10%, rgba(0, 184, 234, 0.14), transparent 60%),
                radial-gradient(50rem 30rem at -10% 30%, rgba(0, 184, 234, 0.10), transparent 60%),
                radial-gradient(70rem 45rem at 50% 120%, rgba(0, 184, 234, 0.12), transparent 62%);
            background-attachment: fixed;
        }
        .grid-bg {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(70% 60% at 50% 0, #000 30%, transparent 75%);
            mask-image: radial-gradient(70% 60% at 50% 0, #000 30%, transparent 75%);
        }

        body:not(.loaded) { overflow: hidden; }

        :focus-visible { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 4px; }
        .video-card:focus-visible, .sound-card:focus-visible, .coverflow-item:focus-visible { outline-offset: 8px; }

        ::selection { background: var(--accent); color: #04121a; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0d1524; }
        ::-webkit-scrollbar-thumb { background: #27334a; border-radius: 6px; border: 2px solid #0d1524; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* --- CINEMATIC LOAD SEQUENCE --- */
        body:not(.loaded) #text-left,
        body:not(.loaded) #text-right,
        body:not(.loaded) .center-graphic img,
        body:not(.loaded) .badge,
        body:not(.loaded) nav { opacity: 0 !important; }

        .loaded #text-left { animation: slamLeft 1.4s cubic-bezier(0.1, 1, 0.2, 1) 0s backwards !important; }
        .loaded #text-right { animation: slamRight 1.4s cubic-bezier(0.1, 1, 0.2, 1) 0s backwards !important; }
        .loaded .center-graphic img { animation: heroRise 1.4s cubic-bezier(0.1, 1, 0.2, 1) 0s backwards !important; }
        .loaded #badge-ae { animation: badgePop 1.2s cubic-bezier(0.3, 1.5, 0.4, 1) 0s backwards !important; }
        .loaded #badge-pr { animation: badgePop 1.2s cubic-bezier(0.3, 1.5, 0.4, 1) 0s backwards !important; }
        .loaded #badge-dv { animation: badgePop 1.2s cubic-bezier(0.3, 1.5, 0.4, 1) 0s backwards !important; }
        .loaded nav { animation: navDrop 1s ease 1.2s backwards !important; }

        @keyframes slamLeft { 0% { transform: translateX(-15vw) scale(1.3); opacity: 0; filter: blur(20px); } 100% { transform: translateX(0vw) scale(1); opacity: 1; filter: blur(0); } }
        @keyframes slamRight { 0% { transform: translateX(15vw) scale(1.3); opacity: 0; filter: blur(20px); } 100% { transform: translateX(0vw) scale(1); opacity: 1; filter: blur(0); } }
        @keyframes heroRise { 0% { transform: translateY(20vh) scale(1.05); opacity: 0; filter: brightness(0) drop-shadow(0 0 0 transparent); } 50% { filter: brightness(1.5); } 100% { transform: translateY(0) scale(1); opacity: 1; filter: brightness(1) drop-shadow(0 20px 40px rgba(0,0,0,0.8)); } }
        @keyframes navDrop { 0% { transform: translateX(-50%) translateY(-30px); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes badgePop { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* --- UI ELEMENTS --- */
        .timeline-playhead { position: fixed; top: 0; left: 0; width: 100vw; height: 4px; background: var(--accent); z-index: 9999; transform-origin: left; transform: scaleX(0); box-shadow: 0 0 15px var(--accent); will-change: transform; }
        
        .cursor-dot { position: fixed; top: -4px; left: -4px; width: 8px; height: 8px; pointer-events: none; z-index: 100000; will-change: transform; }
        .cursor-dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), background 0.2s ease, box-shadow 0.2s ease; }
        .cursor-dot.hovering::before { transform: scale(3.5); background: transparent; box-shadow: inset 0 0 0 1px var(--accent), 0 0 15px var(--accent-glow); }
        .cursor-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 8px; letter-spacing: 1px; color: #00131c; opacity: 0; transition: opacity 0.15s ease; pointer-events: none; }
        .cursor-dot.mode::before { transform: scale(7.5); background: var(--accent); box-shadow: 0 0 25px var(--accent-strong); }
        .cursor-dot.mode .cursor-label { opacity: 1; }
        body:active .cursor-dot.mode::before { transform: scale(6); }
        @media (hover: none) and (pointer: coarse) { .cursor-dot { display: none !important; } * { cursor: auto !important; } }

        /* --- LIQUID GLASS NAV --- */
        nav { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 800px; padding: 1.2rem 2.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; color: white; font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; font-weight: 600; background: rgba(21, 28, 41, 0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--border-strong); border-top: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.02); }
        .nav-brand { font-family: 'Archivo Expanded', sans-serif; font-size: 1.1rem; letter-spacing: 2px; }
        .nav-links { display: flex; align-items: center; position: relative; }
        .nav-hover-pill { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 38px; width: 0px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05); border-radius: 30px; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0; }
        .nav-links span { cursor: pointer; padding: 8px 18px; margin-left: 5px; transition: color 0.3s; position: relative; z-index: 1; }
        .nav-links span:hover { color: var(--accent); }
    </style>
</head>

        <div class="nav-links">

            <span>MOTION</span>
            <span>TEXT</span>
            <span>SOUND</span>
        </div>
    </nav>

</body>
